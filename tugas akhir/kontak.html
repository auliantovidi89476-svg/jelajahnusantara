<main class="section narrow"><p class="eyebrow">FORMULIR</p><h1>Kirim saran perjalanan</h1><p>Isi formulir berikut untuk menyampaikan destinasi yang kamu minati.</p>
<form id="contactForm" class="form"><label for="nama">Nama lengkap</label><input id="nama" name="nama" type="text" placeholder="Masukkan nama" required minlength="2">
<label for="email">Email</label><input id="email" name="email" type="email" placeholder="nama@email.com" required>
<label for="destinasi">Destinasi pilihan</label><select id="destinasi" name="destinasi" required><option value="">-- Pilih destinasi --</option><option>Bali</option><option>Yogyakarta</option><option>Raja Ampat</option><option>Lainnya</option></select>
<label for="pesan">Pesan / saran</label><textarea id="pesan" name="pesan" rows="5" placeholder="Tulis pesan kamu..." required minlength="5"></textarea>
<button class="btn" type="submit">Kirim Formulir</button><p id="formMessage" role="status" aria-live="polite"></p></form></main><footer><p>© 2026 Jelajah Nusantara · Website proyek akhir</p><a href="index.html">Beranda</a></footer><script src="script.js"></script></body></html>
